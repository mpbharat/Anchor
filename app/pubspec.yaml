name: anchor
description: Anchor — the commitment agent that says no.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # backend / auth
  supabase_flutter: ^2.5.0
  http: ^1.2.0
  # voice (event-day wiring)
  speech_to_text: ^6.6.0
  flutter_tts: ^4.0.2
  # push / nudges
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.0
  # utils
  intl: ^0.19.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
