org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
# Windows: the Gradle daemon fails with "Unable to establish loopback connection"
# when localhost resolves over IPv6 first (hosts entries are commented out by
# default). Forcing the IPv4 stack above fixes it.
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Windows: Kotlin's incremental caches (caches-jvm/jvm/kotlin/*.tab) get held open
# by the on-access file scanner, so compileDebugKotlin dies with "Could not close
# incremental caches". Full recompiles are slower but actually complete.
kotlin.incremental=false
