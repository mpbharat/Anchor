org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
# Windows: the Gradle daemon fails with "Unable to establish loopback connection"
# when localhost resolves over IPv6 first (hosts entries are commented out by
# default). Forcing the IPv4 stack above fixes it.
android.useAndroidX=true
