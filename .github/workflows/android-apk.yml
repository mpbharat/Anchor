name: Android APK

# Builds the Flutter app into an installable APK and uploads it as an artifact.
# Exists because the Gradle/JVM toolchain can't run on some local Windows machines
# (endpoint security blocks AF_UNIX, so java.nio Pipe.open() fails); CI builds it
# instead. Download the artifact and: adb install -r app-debug.apk

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Which APK to build"
        type: choice
        default: debug
        options: [debug, release]
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write # to publish the APK as a release asset

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      # The android/ folder is committed, but regenerate anything missing so the
      # build doesn't depend on local scaffolding.
      - name: Ensure Android platform files
        working-directory: app
        run: flutter create --platforms=android --project-name anchor .

      # Logs need sign-in on this repo, but annotations are public — so on failure
      # we surface the Gradle error as an ::error:: annotation for quick triage.
      - name: Build APK
        working-directory: app
        run: |
          set -o pipefail
          if ! flutter build apk --${{ github.event.inputs.build_type || 'debug' }} 2>&1 | tee /tmp/build.log; then
            echo "::group::Gradle failure (last 120 lines)"
            tail -120 /tmp/build.log
            echo "::endgroup::"
            msg=$(tail -40 /tmp/build.log | tr -d '\r' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=APK build failed::${msg}"
            exit 1
          fi

      - name: Locate APK
        id: apk
        working-directory: app
        run: |
          path=$(find build/app/outputs/flutter-apk -name "*.apk" | head -1)
          echo "path=app/$path" >> "$GITHUB_OUTPUT"
          ls -lh "$path"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anchor-apk-${{ github.event.inputs.build_type || 'debug' }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      # Artifacts need auth to download; release assets on a public repo don't.
      # A rolling "apk-latest" release makes the APK one curl away:
      #   curl -L -o app-debug.apk \
      #     https://github.com/mpbharat/Anchor/releases/download/apk-latest/app-debug.apk
      - name: Publish APK to rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest "${{ steps.apk.outputs.path }}" \
            --title "Latest debug APK" \
            --notes "Auto-built from ${GITHUB_SHA}. Install: adb install -r app-debug.apk" \
            --prerelease
