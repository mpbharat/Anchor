name: Android APK

# Builds the Flutter app into an installable APK and uploads it as an artifact.
# Exists because the Gradle/JVM toolchain can't run on some local Windows machines
# (endpoint security blocks AF_UNIX, so java.nio Pipe.open() fails); CI builds it
# instead. Download the artifact and: adb install -r app-debug.apk

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Which APK to build"
        type: choice
        default: debug
        options: [debug, release]
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      # The android/ folder is committed, but regenerate anything missing so the
      # build doesn't depend on local scaffolding.
      - name: Ensure Android platform files
        working-directory: app
        run: flutter create --platforms=android --project-name anchor .

      - name: Build APK
        working-directory: app
        run: flutter build apk --${{ github.event.inputs.build_type || 'debug' }}

      - name: Locate APK
        id: apk
        working-directory: app
        run: |
          path=$(find build/app/outputs/flutter-apk -name "*.apk" | head -1)
          echo "path=app/$path" >> "$GITHUB_OUTPUT"
          ls -lh "$path"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anchor-apk-${{ github.event.inputs.build_type || 'debug' }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
